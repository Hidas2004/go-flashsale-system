server:
  port: "8081"
  mode: "debug"

database:
  host: "localhost"
  port: "5433"
  user: "postgres"
  password: "postgres"
  dbname: "flashdeal_db"
  sslmode: "disable"
  max_connections: 100
  max_idle_connections: 10

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  pool_size: 100

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  exchange: "flashdeal_exchange"
  queue: "order_queue"
  routing_key: "order.created"
  prefetch_count: 10

jwt:
  secret: "change-me-in-production"
  expire_hours: 72

flash_sale:
  stock_ttl: 3600
  order_timeout: 300

rate_limit:
  limit: 10
  duration: 1 # 10 requests per second per user
